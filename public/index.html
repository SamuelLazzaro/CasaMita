<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Mita — Ristorante e B&B a Marina di Pulsano, Puglia</title>
    <meta name="description"
          content="Casa Mita: ristorante e bed & breakfast sul mare a Marina di Pulsano (Taranto), Puglia. Cucina di famiglia, camere accoglienti a due passi dalla spiaggia.">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

    <!-- ══════════════════ Header ══════════════════ -->
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="#home">
                <img class="brand-logo" src="assets/img/logo-casa-mita.png" alt="Casa Mita">
            </a>

            <div class="header-actions">
                <button id="hamburger" class="hamburger" type="button"
                        aria-expanded="false" aria-controls="nav-panel" aria-label="Apri il menu">
                    <span class="hamburger-bar" aria-hidden="true"></span>
                    <span class="hamburger-bar" aria-hidden="true"></span>
                    <span class="hamburger-bar" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- ══════════════════ Off-canvas navigation ══════════════════ -->
    <div id="nav-overlay" class="nav-overlay" hidden></div>
    <nav id="nav-panel" class="nav-panel" aria-label="Navigazione principale">
        <ul class="nav-list">
            <li><a class="nav-link" href="#home">Home</a></li>
            <li><a class="nav-link" href="#chi-siamo">Chi siamo</a></li>
            <li><a class="nav-link" href="#ristorante">Ristorante &ndash; Menu</a></li>
            <li><a class="nav-link" href="#camere">B&amp;B &ndash; Camere</a></li>
            <li><a class="nav-link" href="#prenotazioni">Prenotazioni camere</a></li>
            <li><a class="nav-link" href="#dove-siamo">Dove siamo</a></li>
            <li><a class="nav-link" href="#contatti">Contatti</a></li>
        </ul>
    </nav>

    <!-- ══════════════════ Main content ══════════════════ -->
    <main>
        <section id="home" class="section section-hero">
            <h1>Casa Mita</h1>
            <p>Ristorante e B&amp;B a Marina di Pulsano</p>
        </section>

        <section id="chi-siamo" class="section">
            <h2>Chi siamo</h2>
        </section>

        <section id="ristorante" class="section">
            <h2>Ristorante &ndash; Menu</h2>
        </section>

        <section id="camere" class="section">
            <h2>B&amp;B &ndash; Camere</h2>
        </section>

        <section id="prenotazioni" class="section">
            <h2>Prenotazioni camere</h2>
        </section>

        <section id="dove-siamo" class="section">
            <h2>Dove siamo</h2>
        </section>

        <section id="contatti" class="section">
            <h2>Contatti</h2>
        </section>

    <!-- ══════════════════ Footer ══════════════════ -->
    <footer class="site-footer">
        <p>&copy; Casa Mita &mdash; Marina di Pulsano (TA)</p>
    </footer>

    <script type="module" src="../src/main.js"></script>

</html>
