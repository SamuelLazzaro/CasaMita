<!DOCTYPE html>
<html lang="it" data-i18n-doc-title="guest.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>La tua prenotazione</title>
    <link rel="stylesheet" href="/css/main.css">
    <script type="module" src="/js/booking.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <div>
                <h1 data-i18n="guest.heading">La tua prenotazione</h1>
                <p class="subtitle" id="venue-name">&nbsp;</p>
            </div>
            <nav class="site-header-nav">
                <button type="button" id="lang-toggle" aria-label="Switch to English">EN</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <p id="loading" class="status" role="status" data-i18n="common.loading">Caricamento…</p>

        <section id="not-found" class="panel" hidden>
            <h2 data-i18n="guest.notFoundTitle">Prenotazione non trovata</h2>
            <p data-i18n="guest.notFoundText">Il link non è valido oppure la prenotazione non è più disponibile. Per assistenza contatta direttamente la struttura.</p>
        </section>

        <section id="booking-section" class="panel" hidden>
            <div class="panel-header">
                <h2 data-i18n="guest.detailsTitle">Dettagli</h2>
                <span id="booking-status-badge" class="badge"></span>
            </div>
            <dl class="details" id="booking-details"></dl>
            <p class="hint" id="booking-pending-hint" data-i18n="guest.pendingHint" hidden>La richiesta è in attesa di conferma: riceverai un'email con l'esito.</p>
            <div class="actions" id="booking-actions" hidden>
                <button type="button" class="btn btn-danger" id="cancel-button" data-i18n="guest.cancel">Annulla prenotazione</button>
            </div>
            <p id="booking-status" class="status" role="status" hidden></p>
        </section>
    </main>

    <footer class="site-footer">
        <p><a href="/privacy.html" data-tenant-href="/privacy" data-i18n="common.privacy">Informativa privacy</a></p>
    </footer>
</body>
</html>
